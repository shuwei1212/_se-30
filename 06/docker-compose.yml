name: dockerboard

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      stats:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s
    logging: *default-logging

  web:
    build:
      context: ./web
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-dockerboard}:${POSTGRES_PASSWORD:-dockerboard_dev}@db:5432/${POSTGRES_DB:-dockerboard}
      STATS_URL: http://stats:8000
      TZ: Asia/Taipei
    depends_on:
      db:
        condition: service_healthy
      stats:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    logging: *default-logging

  stats:
    build:
      context: ./stats
    restart: unless-stopped
    init: true
    environment:
      PORT: "8000"
      TZ: Asia/Taipei
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 5s
    logging: *default-logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dockerboard}
      POSTGRES_USER: ${POSTGRES_USER:-dockerboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dockerboard_dev}
      TZ: Asia/Taipei
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dockerboard} -d ${POSTGRES_DB:-dockerboard}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    logging: *default-logging

volumes:
  pgdata:
    name: dockerboard_pgdata

networks:
  frontend:
    name: dockerboard_frontend
  backend:
    name: dockerboard_backend
    internal: true
